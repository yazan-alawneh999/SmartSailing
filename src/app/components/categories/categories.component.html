
<!-- Categories Section Begin -->
<section class="categories">
  <div class="container">
    <div class="row">
      <div class="categories__slider owl-carousel">
        <div class="col-lg-3"  *ngFor="let category of subCategories()._embedded.subCategoryDtoList;">

          <div class="categories__item set-bg" [attr.data-setbg]="category.imageUrl">
            <h5><a href="#">{{ category.subCategoryName }}</a></h5>
          </div>

        </div>

      </div>
    </div>
  </div>
</section>
<!-- Categories Section End -->
